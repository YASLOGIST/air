name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build · Budgets · Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Lint (ESLint, zero warnings tolerated)
        run: npm run lint -- --max-warnings 0

      - name: Unit & component tests (Vitest, includes axe accessibility scan)
        run: npm run test

      - name: Build + performance budget check
        run: npm run build:check

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
