name: Kinetic README

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/kinetic-readme.yml
      - package.json

permissions:
  actions: read
  contents: write

concurrency:
  group: kinetic-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  animate:
    name: Generate kinetic README assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution-grid SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ vars.README_SNAKE_USER || github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2300E5FF&color_dots=%230D1117,%2310242B,%23004452,%23007D8F,%2300E5FF

      - name: Generate Shields endpoint telemetry
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('assets', { recursive: true });

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function latestRun(workflow_id) {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id,
                  branch: 'main',
                  per_page: 1,
                });
                return data.workflow_runs?.[0] ?? null;
              } catch (error) {
                core.warning(`Unable to load ${workflow_id}: ${error.message}`);
                return null;
              }
            }

            function writeEndpoint(path, payload) {
              fs.writeFileSync(path, `${JSON.stringify({ schemaVersion: 1, labelColor: '0D1117', cacheSeconds: 3600, ...payload }, null, 2)}\n`);
            }

            const quality = await latestRun('quality.yml');
            if (!quality) {
              writeEndpoint('assets/quality-latency.json', {
                label: 'quality latency',
                message: 'pending',
                color: '9BB0BC',
                namedLogo: 'githubactions',
              });
              writeEndpoint('assets/zero-defect-gate.json', {
                label: 'zero-defect gate',
                message: 'pending',
                color: '9BB0BC',
                namedLogo: 'githubactions',
              });
            } else {
              const start = new Date(quality.run_started_at || quality.created_at).getTime();
              const end = new Date(quality.updated_at || quality.created_at).getTime();
              const seconds = Number.isFinite(start) && Number.isFinite(end)
                ? Math.max(0, Math.round((end - start) / 1000))
                : 0;
              const success = quality.conclusion === 'success';
              const latencyColor = success ? (seconds <= 600 ? '00E5FF' : 'F59E0B') : 'FF476F';

              writeEndpoint('assets/quality-latency.json', {
                label: 'quality latency',
                message: `${seconds}s`,
                color: latencyColor,
                namedLogo: 'githubactions',
              });
              writeEndpoint('assets/zero-defect-gate.json', {
                label: 'zero-defect gate',
                message: success ? 'passing' : (quality.conclusion || quality.status || 'unknown'),
                color: success ? '00E5FF' : 'FF476F',
                namedLogo: 'githubactions',
              });
            }

            writeEndpoint('assets/kinetic-refresh.json', {
              label: 'kinetic refresh',
              message: new Date().toISOString().replace(/:\d{2}\.\d{3}Z$/, 'Z'),
              color: '00E5FF',
              namedLogo: 'github',
            });

      - name: Commit generated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(readme): refresh kinetic assets"
          file_pattern: assets/github-snake*.svg assets/*-gate.json assets/*-latency.json assets/*-refresh.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
