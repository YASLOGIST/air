<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static default matches `--c-bg` for the white daylight theme;
         /theme-init.js swaps it to the cockpit surface when dark is saved. -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="YASLOGIST AIR — High-Velocity Critical Freight, e-AWB Pre-Clearance & Active Cold-Chain Telemetry directly integrated with Cairo International Airport (CAI) Cargo Village."
    />
    <link rel="canonical" href="https://air.yaslogist.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YASLOGIST AIR" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
    <meta property="og:title" content="YASLOGIST AIR — Air Freight Intelligence" />
    <meta property="og:description" content="Interactive air-freight simulation, ULD digital twin, corridor intelligence and cold-chain tooling." />
    <meta property="og:url" content="https://air.yaslogist.com" />
    <meta property="og:image" content="https://air.yaslogist.com/assets/og-image-animated.gif" />
    <meta property="og:image:secure_url" content="https://air.yaslogist.com/assets/og-image-animated.gif" />
    <meta property="og:image:type" content="image/gif" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="YASLOGIST AIR — animated flight-corridor HUD showing an FRA to CAI air-freight route, simulated telemetry chips and a radar sweep." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://air.yaslogist.com/assets/og-image-static.jpg" />
    <meta name="twitter:image:alt" content="YASLOGIST AIR — flight-corridor HUD showing an FRA to CAI air-freight route with simulated telemetry." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Keep in exact sync with the Content-Security-Policy header in vercel.json
         (frame-ancestors is header-only: browsers ignore it in a meta policy).
         src/test/csp.test.ts fails the build if the two ever diverge. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://vitals.vercel-insights.com; upgrade-insecure-requests" />
    <title>YASLOGIST AIR — Time-Critical Air Freight & Cold-Chain Telemetry</title>
    <script src="./theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter is the single Latin family (400/500/600/700 only); Cairo covers
         Arabic and IBM Plex Mono is reserved for telemetry. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Canonical YASLOGIST Monogram Mark (Cyan & Aero Steel) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%2338bdf8'%3E%3Cg stroke-width='1.6' opacity='.55'%3E%3Cellipse cx='32' cy='32' rx='12.5' ry='29'/%3E%3Cpath d='M3 32h58M8 17.5h48M8 46.5h48'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='29' stroke-width='2.2' stroke='%239BB0BC'/%3E%3Cg stroke-width='5' stroke-linecap='square'%3E%3Cpath d='M16 16 L27.5 31.5 L27.5 49'/%3E%3Cpath d='M39 16 L30 28'/%3E%3Cpath d='M40.5 20 L40.5 48 L53 48'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-DdGOzgq5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-kUsNB0pQ.css">
  </head>
  <body class="antialiased selection:bg-sky-600/15 selection:text-sky-900">
    <div id="root"></div>
    <!-- The suite is a client-rendered simulation, so #root is empty without
         JavaScript. Say so plainly rather than leaving a blank page, and keep
         the operational boundary visible even here. Styles are inline because
         this has to stand on its own if the stylesheet is the thing that
         failed. -->
    <noscript>
      <div style="max-width:40rem;margin:6rem auto;padding:2rem;font-family:system-ui,sans-serif;color:#1f2937;background:#ffffff;border:1px solid #e5e7eb;border-radius:1rem;line-height:1.6">
        <h1 style="font-size:1.25rem;margin-bottom:.75rem">YASLOGIST AIR needs JavaScript</h1>
        <p style="margin-bottom:1rem">
          The air-freight cockpit — chargeable-weight simulator, ULD digital twin, corridor globe and
          AWB checksum tool — runs entirely in the browser, so it cannot render without JavaScript enabled.
        </p>
        <p style="margin-bottom:1rem">
          This is an interactive <strong>simulation</strong>. It is not connected to an airline, IATA,
          Nafeza, an airport operator, or any live telemetry feed.
        </p>
        <p style="margin:0">
          Air freight enquiries: <a href="mailto:contact@yaslogist.com" style="color:#0369a1">contact@yaslogist.com</a>
        </p>
      </div>
    </noscript>
  </body>
</html>
