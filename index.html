    />
    <title>YASLOGIST AIR — Time-Critical Air Freight & Cold-Chain Telemetry</title>
    <script>
      try {
        /* First visit follows the OS colour scheme; an explicit choice in
           localStorage always wins. Dark remains the fallback brand default. */
        var t = localStorage.getItem("yaslogist-air-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
        var l = localStorage.getItem("yaslogist-air-lang") || "en";
        if (l === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        } else {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        }
      } catch (e) {}
    </script>
